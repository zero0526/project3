nodes:
  cloud:
    type: "cloud"
    cpu_min: 5600 # GFLOPS
    cpu_max: 5600
    ram: 80 # GB
    hdd: 80

  edge:
    type: "edge"
    cpu_min: 3000 # GFLOPS
    cpu_max: 4000
    ram: 20 # GB
    hdd: 10

  network:
    type: "network"
    cpu_min: 800 # GFLOPS
    cpu_max: 1200
    ram: 10 # GB
    hdd: 10 # GB
  relay:
    type: "relay"
    cpu_min: 0
    cpu_max: 0
    ram: 0
    hdd: 0

links:
  tranmission_rate_min: 50 # mb/s
  tranmission_rate_max: 100

energy:
  computation_coef: 5e-10 # w
  cold_start: 0.2
  tranmission_coef: 0.2

lypa_coef: 1e-7
cold_start_time:
  min: 0.15 #s
  max: 0.85
avg_req: 20 #per slot

coordinate:
