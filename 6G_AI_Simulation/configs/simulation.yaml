simulation:
  seed: 42
  device: "cpu" 

  time:
    slot_duration: 0.1       # second
    slots_per_frame: 10      
    total_episodes: 200     
    max_steps: 100          

  paths:
    topology_xml: "configs/topologies/atlanta.xml"        # File src SNDLib
    topology_json: "configs/topologies/atlanta_processed.json" 
    logs: "data/logs/"
    checkpoints: "data/checkpoints/"
    results: "data/results/"

  workload:
    arrival_rate: 30
    zipf_param: 0.8