network:
  topology_file: "configs/topologies/atlanta.graphml"
  bandwidth_edge_cloud: 1000 # Mbps
  bandwidth_edge_edge: 500   # Mbps

time:
  slot_duration: 0.1 # seconds (100ms)
  slots_per_frame: 100 # T
  total_episodes: 3000

agents:
  num_terminals: 60
  num_edge_nodes: 8
  
energy:
  coeff_transmission: 0.2
  coeff_computation: 1e-10
  cold_start_cost: 0.2

services:
  - name: "Object Detection"
    type: "Occasional"
    model_size: 500 # MB
    gflops: 4.5
    deadline: 0.5 # s
    min_accuracy: 0.8